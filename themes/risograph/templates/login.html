{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Constellatio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'themes/risograph/css/risograph.css' %}">
</head>
<body class="r-grain" style="background: var(--r-paper); color: var(--r-ink);">

  <div class="min-vh-100 d-flex align-items-center justify-content-center px-3">
    <div style="max-width:420px; width:100%;">

      <!-- 登录卡：硬边彩色阴影 + 套印规线角标 -->
      <div class="r-card position-relative p-4">
        <span class="r-register-mark"></span>

        <div class="mb-4">
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="d-inline-block" style="width:18px;height:18px;border:2px solid var(--r-ink);background:var(--r-pink);"></span>
            <h1 class="fw-bold text-uppercase mb-0" style="font-size:1.5rem; letter-spacing:.08em;">Constellatio</h1>
          </div>
          <p class="mb-0" style="font-size:.8rem; color:rgba(26,26,26,.6);">企业办公自动化 · Risograph 印刷风</p>
        </div>

        {% if error %}
        <div class="r-badge r-badge--orange d-inline-block mb-3">{{ error }}</div>
        {% endif %}

        <form method="post" action="/plugins/auth/login/">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" style="font-size:.75rem; text-transform:uppercase; letter-spacing:.06em;">用户名</label>
            <input class="r-input" type="text" name="username" autocomplete="username" placeholder="输入用户名" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label" style="font-size:.75rem; text-transform:uppercase; letter-spacing:.06em;">密码</label>
            <input class="r-input" type="password" name="password" autocomplete="current-password" placeholder="输入密码" required>
          </div>
          <button class="r-btn w-100" type="submit">登 录</button>
        </form>
      </div>

      <p class="text-center mt-3" style="font-size:.7rem; color:rgba(26,26,26,.6);">
        Constellatio · 万物皆可插件
      </p>
    </div>
  </div>

</body>
</html>
