# Constellatio 一键部署（MySQL8 + Ollama + Web，跨平台：Linux/macOS/Windows Docker）
#
# 用法：docker compose up -d --build
# 环境变量可写 .env 覆盖（参考 .env.example）
#
# 内置模型：首次启动由 ollama-init 拉取 OLLAMA_MODEL（默认 qwen3:4b）到 ollama_data 卷；
# 模型已在卷里则直接跳过，不再请求 registry。
# Docker Hub 不可达时可用 OLLAMA_IMAGE 指向可用镜像源（同一 tag）。

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-constellatio2026}
      MYSQL_DATABASE: ${DB_NAME:-constellatio}
      MYSQL_USER: ${DB_USER:-constellatio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-constellatio2026}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USER:-constellatio}", "-p${DB_PASSWORD:-constellatio2026}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.11}
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # 一次性初始化：只负责把内置模型拉进 ollama_data；已存在时秒退，可重复执行。
  # 已存在则不发网络请求，离线重启不会被 registry 卡住。
  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.11}
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if ollama list | awk 'NR > 1 {print $1}' | grep -qx "$${OLLAMA_MODEL}"; then
          echo "model $${OLLAMA_MODEL} already present"
        else
          echo "pulling $${OLLAMA_MODEL}"
          ollama pull "$${OLLAMA_MODEL}"
        fi
        echo "warming $${OLLAMA_MODEL}"
        ollama run "$${OLLAMA_MODEL}" "hi" >/dev/null 2>&1 || echo "warmup skipped"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    environment:
      DB_ENGINE: mysql
      DB_NAME: ${DB_NAME:-constellatio}
      DB_USER: ${DB_USER:-constellatio}
      DB_PASSWORD: ${DB_PASSWORD:-constellatio2026}
      DB_HOST: db
      DB_PORT: 3306
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      # v1.7.15：**不给默认值**。compose 层一旦有默认 key，settings 里「生产模式缺 SECRET_KEY
      # 拒绝启动」的硬要求就永远不会触发（默认部署路径反而最不安全）。
      # 缺省时 `docker compose config/up` 直接报错退出，是这里期望的失败方式。
      # 生成：python -c "import secrets;print(secrets.token_urlsafe(50))"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 必须设置（生产模式拒绝使用默认值；生成方式见部署文档）}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      OA_THEME: ${OA_THEME:-corporate-clean}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-Constellatio@2026}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      # v1.7.0 企业 SSO（生产务必覆盖共享密钥）
      SSO_SHARED_SECRET: ${SSO_SHARED_SECRET:-constellatio-sso-dev-secret}
      SSO_TICKET_TTL: ${SSO_TICKET_TTL:-300}
      SSO_AUTO_CREATE: ${SSO_AUTO_CREATE:-1}
      # v1.8.0 传输安全：默认直连 HTTP；前置反代终止 TLS 后改为 1
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_SSL_REDIRECT: ${DJANGO_SSL_REDIRECT:-0}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
      # v2.3.0 A 阶段：内置 Ollama，默认 qwen3:4b；配置页可按字段覆盖。
      # 指向公网服务时对话文本会离开本机，配置前先确认数据流向。
      ASSISTANT_LLM_BASE_URL: ${ASSISTANT_LLM_BASE_URL:-http://ollama:11434/v1}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-qwen3:4b}
      ASSISTANT_LLM_API_KEY: ${ASSISTANT_LLM_API_KEY:-}
      ASSISTANT_LLM_TIMEOUT: ${ASSISTANT_LLM_TIMEOUT:-240}
      ASSISTANT_LLM_MAX_TOKENS: ${ASSISTANT_LLM_MAX_TOKENS:-1536}
    command: ["sh", "./entrypoint.sh"]
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media   # v1.5.14：审批附件持久化
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      # 等模型就绪再放流量：否则 Web 起来了、首次对话却拿不到 4B。
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db_data:
  media_data:
  ollama_data:

