# Constellatio 一键部署（MySQL8 + Web，跨平台：Linux/macOS/Windows Docker）
#
# 用法：docker compose up -d --build
# 环境变量可写 .env 覆盖（参考 .env.example）

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-constellatio2026}
      MYSQL_DATABASE: ${DB_NAME:-constellatio}
      MYSQL_USER: ${DB_USER:-constellatio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-constellatio2026}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USER:-constellatio}", "-p${DB_PASSWORD:-constellatio2026}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build: .
    environment:
      DB_ENGINE: mysql
      DB_NAME: ${DB_NAME:-constellatio}
      DB_USER: ${DB_USER:-constellatio}
      DB_PASSWORD: ${DB_PASSWORD:-constellatio2026}
      DB_HOST: db
      DB_PORT: 3306
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      # v1.7.15：**不给默认值**。compose 层一旦有默认 key，settings 里「生产模式缺 SECRET_KEY
      # 拒绝启动」的硬要求就永远不会触发（默认部署路径反而最不安全）。
      # 缺省时 `docker compose config/up` 直接报错退出，是这里期望的失败方式。
      # 生成：python -c "import secrets;print(secrets.token_urlsafe(50))"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 必须设置（生产模式拒绝使用默认值；生成方式见部署文档）}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      OA_THEME: ${OA_THEME:-corporate-clean}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-Constellatio@2026}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      # v1.7.0 企业 SSO（生产务必覆盖共享密钥）
      SSO_SHARED_SECRET: ${SSO_SHARED_SECRET:-constellatio-sso-dev-secret}
      SSO_TICKET_TTL: ${SSO_TICKET_TTL:-300}
      SSO_AUTO_CREATE: ${SSO_AUTO_CREATE:-1}
      # v1.8.0 传输安全：默认直连 HTTP；前置反代终止 TLS 后改为 1
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_SSL_REDIRECT: ${DJANGO_SSL_REDIRECT:-0}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
      # v2.3.0 A 阶段：OpenAI 兼容模型服务。base_url + model 同时非空才启用对话输入；
      # api_key 可空（ollama / llama.cpp 本地服务通常不校验）。
      ASSISTANT_LLM_BASE_URL: ${ASSISTANT_LLM_BASE_URL:-}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-}
      ASSISTANT_LLM_API_KEY: ${ASSISTANT_LLM_API_KEY:-}
      ASSISTANT_LLM_TIMEOUT: ${ASSISTANT_LLM_TIMEOUT:-30}
      ASSISTANT_LLM_MAX_TOKENS: ${ASSISTANT_LLM_MAX_TOKENS:-1024}
    command: ["sh", "./entrypoint.sh"]
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media   # v1.5.14：审批附件持久化
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  media_data:
