{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "发布公告" %} · Constellatio{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{% url 'notice:notice_list' %}" class="r-offset-hover">← {% trans "返回" %}</a>
  <h2 class="mb-0">{% trans "发布公告" %}</h2>
</div>
<div class="r-card position-relative" style="max-width:560px;">
  <span class="r-register-mark"></span>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" style="font-size:.75rem; text-transform:uppercase;">标题</label>
      <input class="r-input" type="text" name="title" required placeholder="公告标题">
    </div>
    <div class="mb-3">
      <label class="form-label" style="font-size:.75rem; text-transform:uppercase;">内容</label>
      <textarea class="r-input" name="content" rows="8" required placeholder="公告正文"></textarea>
    </div>
    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" name="is_top" id="is_top">
      <label class="form-check-label" for="is_top">置顶</label>
    </div>
    <button class="r-btn" type="submit">{% trans "发布" %}</button>
  </form>
</div>
{% endblock %}
