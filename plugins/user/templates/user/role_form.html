{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ title }} · Constellatio{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{% url 'user:role_list' %}" class="r-offset-hover">← {% trans "返回" %}</a>
  <h2 class="mb-0">{{ title }}</h2>
</div>
<div class="r-card position-relative" style="max-width:560px;">
  <span class="r-register-mark"></span>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" style="font-size:.75rem; text-transform:uppercase;">角色名</label>
      {{ form.name }}
    </div>
    <div class="mb-3">
      <label class="form-label" style="font-size:.75rem; text-transform:uppercase;">权限（权限码）</label>
      {{ form.permissions }}
      <div class="text-muted mt-1" style="font-size:.75rem;">按住 Ctrl 多选；权限码格式：插件名_权限</div>
    </div>
    <button class="r-btn" type="submit">{% trans "保存" %}</button>
  </form>
</div>
{% endblock %}
