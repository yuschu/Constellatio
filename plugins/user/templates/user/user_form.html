{% extends "base.html" %}
{% block title %}{{ title }} · Constellatio{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{% url 'user:user_list' %}" class="r-offset-hover">← 返回</a>
  <h2 class="mb-0">{{ title }}</h2>
</div>
<div class="r-card position-relative" style="max-width:560px;">
  <span class="r-register-mark"></span>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label" style="font-size:.75rem; text-transform:uppercase;">{{ field.label }}</label>
      {{ field }}
      {% for e in field.errors %}<div class="text-danger" style="font-size:.8rem;">{{ e }}</div>{% endfor %}
    </div>
    {% endfor %}
    <button class="r-btn" type="submit">保存</button>
  </form>
</div>
{% endblock %}
