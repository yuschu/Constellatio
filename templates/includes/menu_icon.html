{% comment %}
业务页「功能」侧栏图标：菜单 icon 字段存语义 key，这里统一渲染 16px SVG。
- 插件：用户指定的四叶风车（与首页「浏览更多插件」同一枚 path）。
- 其余：按 DSH 线性图标口径，取自 IconPark（48 viewBox 缩到 16，描边统一 1.2px 视觉）。
新增菜单时在对应 apps.py 写 key，并在这里补一个分支；未知 key 回落到通用文档图标。
{% endcomment %}
{% if icon == 'plugin' %}
<svg class="ds-rail__svg" viewBox="0 0 16 16" width="14" height="14"
     fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
  <path d="M7.84457 5.06199C11.6605 4.93876 14.7962 6.14848 14.8484 7.76397C14.8875 8.97461 13.1838 10.0696 10.7215 10.5942"></path>

</svg>
